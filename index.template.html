<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acid Talks</title>
    <meta name="description" content="Slide decks from Acid Tango talks." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf7;
        --fg: #16161a;
        --muted: #63636e;
        --line: #e2e2dc;
        --accent: #5b2be0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121214;
          --fg: #f1f1ee;
          --muted: #a0a0ab;
          --line: #2a2a30;
          --accent: #b39bff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 72px 16px 96px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .intro {
        margin: 0 0 48px;
        color: var(--muted);
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--line);
      }
      li {
        border-bottom: 1px solid var(--line);
      }
      li a {
        display: block;
        padding: 20px 0;
        color: inherit;
        text-decoration: none;
      }
      li span {
        display: block;
      }
      .title {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.3;
      }
      li a:hover .title,
      li a:focus-visible .title {
        color: var(--accent);
      }
      .byline {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .description {
        margin-top: 8px;
      }
      ul:empty::after {
        content: 'No talks published yet.';
        display: block;
        padding: 20px 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Acid Talks</h1>
      <p class="intro">Slide decks from Acid Tango talks.</p>
      <ul><!-- TALKS --></ul>
    </main>
  </body>
</html>
