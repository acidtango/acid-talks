<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acid Talks</title>
    <meta name="description" content="Slide decks from Acid Tango talks." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Montserrat:wght@500;600;700;800&display=swap"
    />
    <style>
      /* Acid Tango talk template palette: night background, striped sun, perspective grid. */
      :root {
        color-scheme: dark;
        --night: #141413;
        --panel: #1e1e1c;
        --line: #34332f;
        --fg: #f5f3ee;
        --muted: #b4b1a8;
        --dim: #75736c;
        --sun: #ffc419;
        --sun-soft: rgba(255, 196, 25, 0.13);
        --grid: rgba(255, 255, 255, 0.13);
        --display: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        --gutter: max(16px, 6vw);
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--night);
      }
      body {
        margin: 0;
        background: var(--night);
        color: var(--fg);
        font: 17px/1.5 var(--body);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--sun);
        outline-offset: 4px;
      }

      /* ---------- Hero ---------- */
      .hero {
        position: relative;
        min-height: min(82vh, 760px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        --horizon: 72%;
      }
      .world {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .sky {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: var(--horizon);
        overflow: hidden;
      }
      .orb {
        position: absolute;
        right: 8vw;
        bottom: 0;
        width: min(46vh, 34vw);
        min-width: 180px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--sun);
        transform: translateY(16%);
        filter: drop-shadow(0 0 70px rgba(255, 196, 25, 0.28));
        -webkit-mask-image: linear-gradient(to bottom, #000 0 47%, transparent 47% 49.5%, #000 49.5% 57%, transparent 57% 60%, #000 60% 67%, transparent 67% 71%, #000 71% 77%, transparent 77% 82%, #000 82% 87%, transparent 87% 93%, #000 93% 100%);
        mask-image: linear-gradient(to bottom, #000 0 47%, transparent 47% 49.5%, #000 49.5% 57%, transparent 57% 60%, #000 60% 67%, transparent 67% 71%, #000 71% 77%, transparent 77% 82%, #000 82% 87%, transparent 87% 93%, #000 93% 100%);
        animation: rise 2.2s cubic-bezier(0.25, 0.7, 0.2, 1) both;
      }
      @keyframes rise {
        from {
          transform: translateY(101%);
        }
      }
      .horizon {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--horizon);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 196, 25, 0.55) 50%, transparent);
      }
      .floor {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--horizon);
        bottom: 0;
        perspective: 26vh;
        perspective-origin: 50% 0;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 70%, transparent);
        mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 70%, transparent);
      }
      .floor-grid {
        position: absolute;
        left: -80%;
        width: 260%;
        top: 0;
        height: 320%;
        transform-origin: 50% 0;
        transform: rotateX(74deg);
        background-image: linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 88px 88px;
        animation: floor 3.2s linear infinite;
      }
      @keyframes floor {
        to {
          background-position: 0 88px;
        }
      }
      .mtn {
        position: absolute;
      }
      .mtn polygon {
        fill: #0a0a09;
      }
      .mtn polyline {
        fill: none;
        stroke: rgba(255, 255, 255, 0.28);
        stroke-width: 1;
      }
      .mtn-l {
        left: 2vw;
        top: calc(var(--horizon) + 4%);
        width: 34vw;
        min-width: 220px;
      }
      .mtn-r {
        right: 2vw;
        top: calc(var(--horizon) - 1%);
        width: 22vw;
        min-width: 140px;
      }

      .hero-content {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 40px var(--gutter) 0;
      }
      .logo {
        display: block;
        width: 168px;
        height: auto;
      }
      .hero-text {
        margin: auto 0;
        padding: 48px 0 18vh;
        max-width: 760px;
      }
      .kicker {
        margin: 0 0 18px;
        color: var(--sun);
        font: 600 14px/1.2 var(--display);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font: 800 clamp(3rem, 11vw, 7.5rem) / 0.95 var(--display);
        letter-spacing: -0.035em;
      }
      h1 span {
        color: var(--sun);
      }
      .lead {
        margin: 24px 0 0;
        max-width: 34em;
        color: var(--muted);
        font-size: clamp(1.05rem, 2.2vw, 1.3rem);
        line-height: 1.45;
        text-wrap: pretty;
      }

      /* ---------- Talks ---------- */
      main {
        position: relative;
        padding: 0 var(--gutter) 96px;
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
        color: var(--dim);
        font: 600 13px/1 var(--display);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .section-head h2 {
        margin: 0;
        font: inherit;
        color: var(--muted);
      }
      .talks {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
        gap: 20px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .talks:empty::after {
        content: 'No talks published yet.';
        color: var(--muted);
      }
      .talk a {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 240px;
        padding: 26px 26px 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        text-decoration: none;
        overflow: hidden;
        transition: border-color 0.25s, transform 0.25s cubic-bezier(0.2, 0.7, 0.2, 1), background 0.25s;
      }
      .talk a::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 3px;
        background: var(--sun);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .talk a:hover,
      .talk a:focus-visible {
        border-color: rgba(255, 196, 25, 0.55);
        background: #232321;
        transform: translateY(-3px);
      }
      .talk a:hover::before,
      .talk a:focus-visible::before {
        transform: scaleX(1);
      }
      .date {
        color: var(--sun);
        font: 600 13px/1 var(--mono);
        letter-spacing: 0.04em;
      }
      .title {
        margin: 18px 0 0;
        font: 700 1.55rem/1.15 var(--display);
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      .description {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.5;
        text-wrap: pretty;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: auto;
        padding-top: 22px;
        color: var(--muted);
        font: 600 13px/1.2 var(--display);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .arrow {
        display: grid;
        place-items: center;
        flex: none;
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--muted);
        font: 18px/1 var(--body);
        transition: background 0.25s, color 0.25s, border-color 0.25s;
      }
      .talk a:hover .arrow,
      .talk a:focus-visible .arrow {
        background: var(--sun);
        border-color: var(--sun);
        color: #161512;
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 28px var(--gutter) 40px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font: 600 12px/1.4 var(--display);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      footer img {
        width: 120px;
        height: auto;
        opacity: 0.85;
      }
      footer a {
        color: var(--muted);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--sun);
      }

      @media (max-width: 640px) {
        .hero {
          min-height: 640px;
          --horizon: 74%;
        }
        .orb {
          right: -10vw;
        }
        .hero-text {
          padding-bottom: 30vh;
        }
        .mtn-r {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb,
        .floor-grid {
          animation: none;
        }
        .talk a,
        .talk a::before {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="world" aria-hidden="true">
        <div class="sky"><div class="orb"></div></div>
        <div class="horizon"></div>
        <div class="floor"><div class="floor-grid"></div></div>
        <svg class="mtn mtn-l" viewBox="0 0 740 150">
          <polygon points="0,148 178,2 738,148" />
          <polyline points="178,2 100,148" />
          <polyline points="178,2 392,148" />
          <polyline points="350,46 392,148" />
          <polyline points="350,46 738,148" stroke-dasharray="4 5" />
        </svg>
        <svg class="mtn mtn-r" viewBox="0 0 540 110">
          <polygon points="0,108 400,2 538,108" />
          <polyline points="400,2 250,108" />
          <polyline points="400,2 460,108" />
          <polyline points="250,40 0,108" stroke-dasharray="4 5" />
        </svg>
      </div>
      <div class="hero-content">
        <img class="logo" src="./assets/acid-tango-logo.png" alt="Acid Tango" width="499" height="79" />
        <div class="hero-text">
          <p class="kicker">Talks by the Acid Tango team</p>
          <h1>Acid <span>Talks</span></h1>
          <p class="lead">What we learn building software, told by the people who built it. Every deck, in one place.</p>
        </div>
      </div>
    </header>
    <main>
      <div class="section-head">
        <h2>All talks</h2>
        <span><!-- TALK_COUNT --></span>
      </div>
      <ul class="talks"><!-- TALKS --></ul>
    </main>
    <footer>
      <img src="./assets/acid-tango-logo.png" alt="Acid Tango" width="499" height="79" />
      <span><a href="https://github.com/acidtango/acid-talks">Source on GitHub</a></span>
    </footer>
  </body>
</html>
